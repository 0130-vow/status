server:
  host: "0.0.0.0"
  port: 8000
  stale_after_seconds: 180
  admin_username: "admin"
  admin_password: "change-me-admin-password"
  admin_session_secret: "change-me-admin-session-secret"
  agents:
    - hostname: "node-01"
      token: "change-me-node-01"

database:
  path: "probe.db"
  retention_days: 30

alert:
  thresholds:
    cpu_percent: 90
    memory_percent: 85
    disk_percent: 85
  cooldown_minutes: 30

notifier:
  type: smtp
  smtp:
    enabled: false
    host: "smtp.example.com"
    port: 465
    use_ssl: true
    username: "your_email@example.com"
    password: "your_password"
    from_addr: "probe@example.com"
    to_addrs:
      - "admin@example.com"
