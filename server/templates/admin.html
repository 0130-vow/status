<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probe Admin</title>
    <link rel="stylesheet" href="/static/style.css?v=strategy-profiles-1">
</head>
<body>
    <div class="container admin-container">
        <header>
            <div>
                <h1>Admin</h1>
                <p>Agent management</p>
            </div>
            <nav class="header-actions">
                <span class="header-session" id="session-user" hidden></span>
                <a class="admin-link" href="/">Overview</a>
                <button id="logout-btn" class="ghost-btn header-logout" hidden>退出</button>
            </nav>
        </header>

        <section class="admin-panel" id="login-panel">
            <div class="admin-grid">
                <label>
                    <span>账号</span>
                    <input id="admin-username" type="text" autocomplete="username" value="admin">
                </label>
                <label>
                    <span>密码</span>
                    <input id="admin-password" type="password" autocomplete="current-password">
                </label>
            </div>
            <div class="admin-actions">
                <button id="login-btn" class="primary-btn">登录</button>
                <span id="login-status"></span>
            </div>
        </section>

        <section id="agent-panel" hidden>
            <section class="admin-panel" id="create-agent-panel" hidden>
                <div class="detail-section-header">
                    <h4>新增 Agent</h4>
                    <button id="close-create-btn" class="ghost-btn" type="button">收起</button>
                </div>
                <div class="admin-grid">
                    <label>
                        <span>策略模板</span>
                        <select id="profile">
                            <option value="standard">标准</option>
                            <option value="low">低负载</option>
                            <option value="high">高频</option>
                        </select>
                    </label>
                    <label>
                        <span>节点标识</span>
                        <input id="hostname" type="text" placeholder="node-02">
                    </label>
                    <label>
                        <span>主控地址</span>
                        <input id="server-url" type="url">
                    </label>
                    <label>
                        <span>上报间隔</span>
                        <input id="interval" type="number" min="5" value="60">
                    </label>
                    <label>
                        <span>探活间隔</span>
                        <input id="service-interval" type="number" min="5" value="300">
                    </label>
                    <label>
                        <span>服务探活</span>
                        <input id="services" type="text">
                    </label>
                    <label>
                        <span>公网 IP</span>
                        <input id="public-ip" type="text" placeholder="可留空">
                    </label>
                    <label>
                        <span>位置</span>
                        <input id="location" type="text" placeholder="Tokyo">
                    </label>
                </div>

                <div class="admin-actions">
                    <button id="register-btn" class="primary-btn">生成安装命令</button>
                    <span id="admin-status"></span>
                </div>
            </section>

            <section class="admin-panel" id="batch-agent-panel" hidden>
                <div class="detail-section-header">
                    <h4>批量新增 Agent</h4>
                    <button id="close-batch-btn" class="ghost-btn" type="button">收起</button>
                </div>
                <div class="admin-grid">
                    <label>
                        <span>策略模板</span>
                        <select id="batch-profile">
                            <option value="standard">标准</option>
                            <option value="low">低负载</option>
                            <option value="high">高频</option>
                        </select>
                    </label>
                    <label>
                        <span>主控地址</span>
                        <input id="batch-server-url" type="url">
                    </label>
                    <label>
                        <span>上报间隔</span>
                        <input id="batch-interval" type="number" min="5" value="60">
                    </label>
                    <label>
                        <span>探活间隔</span>
                        <input id="batch-service-interval" type="number" min="5" value="300">
                    </label>
                    <label class="wide-field">
                        <span>默认服务探活</span>
                        <input id="batch-services" type="text">
                    </label>
                    <label class="wide-field">
                        <span>节点清单</span>
                        <textarea id="batch-agents" rows="8" placeholder="node-01,东京节点,日本东京,203.0.113.10&#10;node-02,香港节点,香港,198.51.100.20"></textarea>
                    </label>
                </div>
                <p class="admin-hint">每行格式：节点标识,显示名,位置,公网 IP；只填节点标识也可以。</p>
                <div class="admin-actions">
                    <button id="batch-register-btn" class="primary-btn">批量生成命令</button>
                    <span id="batch-status"></span>
                </div>
            </section>

            <section class="admin-panel">
                <div class="node-manager-header">
                    <h4>节点管理</h4>
                    <div class="node-manager-actions">
                        <button id="refresh-agents-btn" class="ghost-btn" type="button">刷新</button>
                        <button id="open-create-btn" class="primary-btn" type="button">+ 新增 Agent</button>
                        <button id="open-batch-btn" class="ghost-btn" type="button">批量新增</button>
                    </div>
                </div>
                <div class="agent-bulk-bar">
                    <span id="bulk-selected-count">已选择 0 个节点</span>
                    <button id="bulk-upgrade-btn" class="ghost-btn" type="button">批量升级命令</button>
                    <button id="bulk-cleanup-btn" class="ghost-btn" type="button">批量清理命令</button>
                </div>
                <div class="node-table-wrap">
                    <table class="node-table">
                        <thead>
                            <tr>
                                <th class="select-col"><input id="select-all-agents" class="agent-select-input" type="checkbox" aria-label="选择全部节点"></th>
                                <th>节点名称</th>
                                <th>公网 IP</th>
                                <th>状态</th>
                                <th>操作系统</th>
                                <th>物理位置</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="agent-table-body"></tbody>
                    </table>
                </div>
                <div class="empty" id="agent-empty" hidden>暂无已添加节点</div>
                <div class="agent-list" id="agent-list"></div>
            </section>

            <div class="command-box" id="command-box" hidden>
                <div class="detail-section-header">
                    <h4 id="command-title">命令</h4>
                    <button id="copy-btn" class="ghost-btn">Copy</button>
                </div>
                <textarea id="install-command" readonly rows="7"></textarea>
            </div>
        </section>
    </div>

    <script src="/static/admin.js?v=strategy-profiles-1"></script>
</body>
</html>
